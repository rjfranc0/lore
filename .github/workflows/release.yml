name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach binaries to (e.g. v1.0.0) — for recovering a release that was created without a build, such as when release-please's tag push didn't trigger this workflow"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: lore-linux-x86_64
            use-cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: lore-linux-aarch64
            use-cross: true

          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: lore-macos-x86_64
            use-cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: lore-macos-aarch64
            use-cross: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare artifact
        run: cp target/${{ matrix.target }}/release/lore ${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ matrix.artifact }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
